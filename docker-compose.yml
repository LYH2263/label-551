services:
  db:
    image: mysql:8.0
    container_name: cakeshop-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: cakeshop
      MYSQL_USER: cakeshop
      MYSQL_PASSWORD: cakeshop123
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cakeshop-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cakeshop-backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: cakeshop
      DB_USER: cakeshop
      DB_PASSWORD: cakeshop123
      TZ: Asia/Shanghai
    volumes:
      - uploads_data:/usr/local/tomcat/webapps/ROOT/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - cakeshop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cakeshop-frontend
    volumes:
      - uploads_data:/usr/share/nginx/html/uploads:ro
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - cakeshop-network

volumes:
  mysql_data:
  uploads_data:

networks:
  cakeshop-network:
    driver: bridge
